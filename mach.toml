[project]
id = "graft"
version = "0.1.0"
mach = "^6.3"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[artifact.graft]
kind = "static"
default = true
entry = "lib/graft.mach"
out = "lib/graft"
targets = ["*"]
link = []
need = []

# the test-only modules the library never reaches
[artifact.tests]
kind = "static"
entry = "test/all.mach"
out = "lib/tests"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.3"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
version = "^0.16"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
version = "^0.22"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.25"
