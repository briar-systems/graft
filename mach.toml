[project]
id = "graft"
version = "0.4.0"
mach = "^7"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[artifact.graft]
kind = "static"
default = true
export = true
entry = "lib/graft.mach"
out = "{project.work}/lib/graft"
targets = ["*"]
link = []
need = []

# the test-only modules the library never reaches
[artifact.tests]
kind = "static"
entry = "test/all.mach"
out = "{project.work}/lib/tests"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
version = "^0.18.0"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
version = "^0.24.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.26.0"
