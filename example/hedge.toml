# hedge configuration for the graft example
#
# the service kind "application" tells hedge that this service is hosted
# in-process rather than files or an upstream. the service's `application` is the
# name the executable hands `graft.host.run`, so the two strings must agree.

[server]
name = "graft-example"
# more than one worker, whatever the host's CPU count, so the example always runs
# the one application on several threads at once
workers = 4

[server.limits]
max_connections_per_peer = 256

# the address comes from the environment, so a platform that assigns the port
# sets LISTEN_ADDRESS=0.0.0.0:$PORT and a local run sets 127.0.0.1:8080
[[listener]]
name = "public"
address = "${ENV:LISTEN_ADDRESS}"
transport = "tcp"
protocols = ["http/1.1"]
backlog = 256
accept_depth = 8

# "*" answers every host name, since a deployment's public name is not known here
[host.site]
listener = "public"
server_name = "*"

[service.app]
kind = "application"
application = "site"

# two services hedge answers itself, next to the application: a plain file
# service and a fixed health check. a laurel application is one service among
# several rather than the whole server.
# hedge's static service maps the whole request path under the root, so a
# request for /static/index.html reads public/static/index.html
[service.assets]
kind = "static"
root = "public"

[service.health]
kind = "fixed"
body = "ok\n"

# a literal segment outranks the catch-all, so /static/... and /healthz reach
# hedge's services and everything else reaches the application
[[route]]
name = "assets"
host = "site"
path = "/static/**"
service = "assets"

[[route]]
name = "health"
host = "site"
path = "/healthz"
service = "health"

[[route]]
name = "app"
host = "site"
path = "/**"
service = "app"
