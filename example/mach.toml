[project]
id = "example"
mach = "^7"
version = "0.1.0"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.graft-example]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/graft-example"
targets = ["*"]
link = []
need = []

[dep.graft]
path = "../"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
version = "^0.24.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.26.0"
