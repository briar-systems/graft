[project]
id = "example"
mach = "^6.5"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.graft-example]
kind = "bin"
entry = "bin/main.mach"
out = "bin/graft-example"
targets = ["*"]
link = []
need = []

[dep.graft]
path = "../"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.4"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
version = "^0.23"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.25"
